<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山海 Rogue - 神话探索游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }
        
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        #game-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #stats-bar {
            display: flex;
            gap: 20px;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #999;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #feca57;
        }
        
        .stamina-bar {
            width: 100px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        
        .stamina-fill {
            height: 100%;
            background: linear-gradient(90deg, #48dbfb, #0abde3);
            transition: width 0.3s;
        }
        
        #main-area {
            display: flex;
            flex: 1;
            gap: 10px;
            min-height: 0;
        }
        
        #map-container {
            flex: 3;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
            position: relative;
            overflow: auto;
        }
        
        #map-grid {
            display: grid;
            gap: 2px;
            min-width: min-content;
            margin: 0 auto;
        }
        
        .map-cell {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .map-cell:hover {
            transform: scale(1.1);
            z-index: 10;
        }
        
        .map-cell.chaos {
            background: linear-gradient(135deg, #2d1b4e, #1a0a2e);
            color: #666;
        }
        
        .map-cell.explored {
            background: linear-gradient(135deg, #2d5a2d, #1a3a1a);
        }
        
        .map-cell.player {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            animation: pulse 1s infinite;
        }
        
        .map-cell.locked {
            background: linear-gradient(135deg, #333, #222);
            color: #555;
        }
        
        .map-cell.can-move {
            box-shadow: 0 0 10px #48dbfb;
            cursor: pointer;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        #info-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 300px;
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #feca57;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        
        #log-panel {
            flex: 1;
            max-height: 200px;
        }
        
        #log-content {
            font-size: 13px;
            line-height: 1.6;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
        }
        
        .log-entry.explore { background: rgba(72, 219, 251, 0.1); }
        .log-entry.battle { background: rgba(255, 107, 107, 0.1); }
        .log-entry.temple { background: rgba(254, 202, 87, 0.1); }
        .log-entry.loot { background: rgba(29, 209, 161, 0.1); }
        
        #inventory-panel, #gods-panel, #equipment-panel {
            max-height: 300px;
        }
        
        .item-slot {
            display: flex;
            align-items: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .item-slot:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .item-icon {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-name {
            font-weight: bold;
            font-size: 14px;
        }
        
        .item-desc {
            font-size: 11px;
            color: #999;
        }
        
        .item-quantity {
            color: #feca57;
            font-weight: bold;
        }
        
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #feca57;
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #feca57;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .modal-content {
            margin-bottom: 20px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #feca57, #f39c12);
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #48dbfb, #0abde3);
            color: #1a1a2e;
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #ff6b6b, #ee5a5a);
            color: white;
        }
        
        .btn-disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        
        .battle-screen {
            text-align: center;
        }
        
        .battle-combatants {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .combatant {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            min-width: 150px;
        }
        
        .combatant-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .combatant-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .health-bar-container {
            height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
            transition: width 0.3s;
        }
        
        .health-text {
            font-size: 12px;
            margin-top: 5px;
            color: #ff6b6b;
        }
        
        .battle-log {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .god-card {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .god-card.offering {
            border: 2px solid #feca57;
        }
        
        .god-icon {
            font-size: 36px;
            margin-right: 15px;
        }
        
        .god-info {
            flex: 1;
        }
        
        .god-name {
            font-weight: bold;
            font-size: 14px;
        }
        
        .god-title {
            font-size: 11px;
            color: #999;
        }
        
        .god-blessing {
            font-size: 12px;
            color: #48dbfb;
            margin-top: 3px;
        }
        
        .god-faith {
            font-size: 12px;
            color: #feca57;
            margin-top: 3px;
        }
        
        .temple-screen {
            text-align: center;
        }
        
        .temple-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .offering-cost {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        #tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #999;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: linear-gradient(45deg, #feca57, #f39c12);
            color: #1a1a2e;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid #feca57;
        }
        
        .cell-tooltip {
            display: none;
        }
        
        .map-cell:hover .cell-tooltip {
            display: block;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
            border: 1px solid #feca57;
            margin-bottom: 5px;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        #start-screen h1 {
            font-size: 48px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        
        #start-screen p {
            color: #999;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
            line-height: 1.8;
        }
        
        #start-btn {
            padding: 15px 50px;
            font-size: 18px;
            border-radius: 10px;
        }
        
        .stats-detail {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .stat-detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 5px;
        }
        
        .stat-detail-label {
            font-size: 11px;
            color: #999;
        }
        
        .stat-detail-value {
            font-size: 14px;
            font-weight: bold;
            color: #48dbfb;
        }
        
        .defeated-god {
            opacity: 0.5;
            text-decoration: line-through;
        }
        
        .victory-text {
            color: #1dd1a1;
            font-weight: bold;
        }
        
        .defeat-text {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>🏔️ 山海 Rogue</h1>
        <p>
            穿越混沌，探索未知的山海经世界<br>
            斩妖除魔，供奉神明，收集神器<br>
            在这片杂草丛生的混沌之地，书写你的传奇
        </p>
        <button class="btn btn-primary" id="start-btn" onclick="game.startGame()">开始探索</button>
    </div>

    <div id="game-container" style="display: none;">
        <div id="header">
            <div id="game-title">🏔️ 山海 Rogue</div>
            <div id="stats-bar">
                <div class="stat-item">
                    <span class="stat-label">层数</span>
                    <span class="stat-value" id="floor-num">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">体力</span>
                    <span class="stat-value" id="stamina-value">100/100</span>
                    <div class="stamina-bar">
                        <div class="stamina-fill" id="stamina-bar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">香火</span>
                    <span class="stat-value" id="incense-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">金币</span>
                    <span class="stat-value" id="gold-value">0</span>
                </div>
            </div>
        </div>
        
        <div id="main-area">
            <div id="map-container">
                <div id="map-grid"></div>
            </div>
            
            <div id="info-panel">
                <div class="panel" id="log-panel">
                    <div class="panel-title">📜 探索日志</div>
                    <div id="log-content"></div>
                </div>
                
                <div id="tab-buttons">
                    <button class="tab-btn active" onclick="game.switchTab('inventory')">🎒 背包</button>
                    <button class="tab-btn" onclick="game.switchTab('equipment')">⚔️ 装备</button>
                    <button class="tab-btn" onclick="game.switchTab('gods')">🛕 神明</button>
                    <button class="tab-btn" onclick="game.switchTab('stats')">📊 属性</button>
                </div>
                
                <div class="panel tab-content active" id="inventory-tab">
                    <div class="panel-title">🎒 背包物品</div>
                    <div id="inventory-content"></div>
                </div>
                
                <div class="panel tab-content" id="equipment-tab">
                    <div class="panel-title">⚔️ 已装备</div>
                    <div id="equipment-content"></div>
                </div>
                
                <div class="panel tab-content" id="gods-tab">
                    <div class="panel-title">🛕 神明图鉴</div>
                    <div id="gods-content"></div>
                </div>
                
                <div class="panel tab-content" id="stats-tab">
                    <div class="panel-title">📊 角色属性</div>
                    <div class="stats-detail" id="stats-content"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

            ],
            
            items: [
                { id: 'health_potion', name: '生命药水', icon: '🧪', type: 'consumable', effect: { hp: 30 }, desc: '恢复30点生命' },
                { id: 'stamina_potion', name: '体力药水', icon: '⚡', type: 'consumable', effect: { stamina: 25 }, desc: '恢复25点体力' },
                { id: 'incense', name: '香火', icon: '🕯️', type: 'currency', desc: '用于供奉神明' },
                { id: 'gold', name: '金币', icon: '💰', type: 'currency', desc: '通用货币' },
                { id: 'key', name: '钥匙', icon: '🔑', type: 'key', desc: '可以打开宝箱' }
            ]
        };

        class Game {
            constructor() {
                this.player = null;
                this.map = null;
                this.currentFloor = 1;
                this.gameState = 'start';
                this.currentBattle = null;
                this.unlockedGods = new Set();
                this.blessings = {};
                this.logs = [];
            }
            
            startGame() {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                
                this.initPlayer();
                this.initMap();
                this.renderAll();
                this.addLog('你从混沌中醒来，四周杂草丛生...', 'explore');
            }
            
            initPlayer() {
                this.player = {
                    x: 5,
                    y: 5,
                    hp: 100,
                    maxHp: 100,
                    stamina: 100,
                    maxStamina: 100,
                    baseAttack: 5,
                    baseDefense: 2,
                    attack: 5,
                    defense: 2,
                    moveSpeed: 1,
                    moveCostReduction: 0,
                    critChance: 0.05,
                    critDamage: 1.5,
                    damageMultiplier: 1,
                    staminaRegen: 1,
                    hpRegenPerTurn: 0,
                    incense: 10,
                    gold: 0,
                    inventory: [],
                    equipment: {
                        weapon: null,
                        armor: null,
                        boots: null,
                        accessory: null
                    },
                    unlockedGods: []
                };
            }
            
            initMap() {
                const mapSize = 11;
                this.map = [];
                
                for (let y = 0; y < mapSize; y++) {
                    this.map[y] = [];
                    for (let x = 0; x < mapSize; x++) {
                        this.map[y][x] = {
                            x, y,
                            explored: false,
                            type: 'chaos',
                            content: null
                        };
                    }
                }
                
                const startX = Math.floor(mapSize / 2);
                const startY = Math.floor(mapSize / 2);
                this.player.x = startX;
                this.player.y = startY;
                this.map[startY][startX].explored = true;
                this.map[startY][startX].type = 'explored';
                
                this.exploreAdjacent(startX, startY);
                this.generateMapContent();
            }
            
            exploreAdjacent(x, y) {
                const directions = [
                    { dx: 0, dy: -1 },
                    { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 },
                    { dx: 1, dy: 0 }
                ];
                
                directions.forEach(({ dx, dy }) => {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (this.isValidPosition(nx, ny) && !this.map[ny][nx].explored) {
                        this.map[ny][nx].type = 'locked';
                    }
                });
            }
            
            generateMapContent() {
                const mapSize = this.map.length;
                const contentTypes = ['monster', 'temple', 'chest', 'supply', 'empty'];
                const weights = [0.35, 0.1, 0.2, 0.15, 0.2];
                
                for (let y = 0; y < mapSize; y++) {
                    for (let x = 0; x < mapSize; x++) {
                        if (x === this.player.x && y === this.player.y) continue;
                        
                        const cell = this.map[y][x];
                        const rand = Math.random();
                        let cumulative = 0;
                        
                        for (let i = 0; i < contentTypes.length; i++) {
                            cumulative += weights[i];
                            if (rand < cumulative) {
                                cell.contentType = contentTypes[i];
                                break;
                            }
                        }
                        
                        if (cell.contentType === 'monster') {
                            const floorMultiplier = 1 + (this.currentFloor - 1) * 0.2;
                            const availableMonsters = DATA.monsters.filter(m => {
                                const difficulty = (m.hp + m.attack * 3) / 10;
                                return difficulty <= this.currentFloor + 2;
                            });
                            
                            if (availableMonsters.length > 0) {
                                const monster = availableMonsters[Math.floor(Math.random() * availableMonsters.length)];
                                cell.content = {
                                    ...monster,
                                    hp: Math.floor(monster.hp * floorMultiplier),
                                    maxHp: Math.floor(monster.hp * floorMultiplier),
                                    attack: Math.floor(monster.attack * floorMultiplier),
                                    defense: Math.floor(monster.defense * floorMultiplier)
                                };
                            } else {
                                cell.contentType = 'empty';
                            }
                        } else if (cell.contentType === 'temple') {
                            const availableGods = DATA.gods.filter(g => !this.unlockedGods.has(g.id));
                            if (availableGods.length > 0) {
                                cell.content = availableGods[Math.floor(Math.random() * availableGods.length)];
                            } else {
                                cell.contentType = 'supply';
                                cell.content = { type: 'full_restore' };
                            }
                        } else if (cell.contentType === 'chest') {
                            cell.content = this.generateChestContent();
                        } else if (cell.contentType === 'supply') {
                            cell.content = {
                                type: Math.random() > 0.5 ? 'health' : 'stamina'
                            };
                        }
                    }
                }
            }
            
            generateChestContent() {
                const rand = Math.random();
                
                if (rand < 0.3) {
                    const equipment = DATA.equipment[Math.floor(Math.random() * DATA.equipment.length)];
                    return { type: 'equipment', item: { ...equipment } };
                } else if (rand < 0.6) {
                    const incenseAmount = 10 + Math.floor(Math.random() * 20) + this.currentFloor * 5;
                    return { type: 'incense', amount: incenseAmount };
                } else if (rand < 0.8) {
                    const goldAmount = 20 + Math.floor(Math.random() * 30) + this.currentFloor * 10;
                    return { type: 'gold', amount: goldAmount };
                } else {
                    const potionType = Math.random() > 0.5 ? 'health_potion' : 'stamina_potion';
                    const potion = DATA.items.find(i => i.id === potionType);
                    return { type: 'potion', item: { ...potion }, quantity: 1 + Math.floor(Math.random() * 2) };
                }
            }
            
            isValidPosition(x, y) {
                return x >= 0 && x < this.map[0].length && y >= 0 && y < this.map.length;
            }
            
            canMoveTo(x, y) {
                if (!this.isValidPosition(x, y)) return false;
                const cell = this.map[y][x];
                if (cell.explored) return true;
                if (cell.type === 'locked') {
                    const moveCost = Math.floor(10 * (1 - this.player.moveCostReduction));
                    return this.player.stamina >= moveCost;
                }
                return false;
            }
            
            moveTo(x, y) {
                if (this.gameState !== 'playing' && this.gameState !== 'start') return;
                if (!this.canMoveTo(x, y)) return;
                if (x === this.player.x && y === this.player.y) return;
                
                const cell = this.map[y][x];
                
                if (!cell.explored) {
                    const moveCost = Math.floor(10 * (1 - this.player.moveCostReduction));
                    if (this.player.stamina < moveCost) {
                        this.addLog('体力不足，无法探索！', 'explore');
                        return;
                    }
                    this.player.stamina -= moveCost;
                    cell.explored = true;
                    cell.type = 'explored';
                    this.exploreAdjacent(x, y);
                    this.addLog(`探索了新区域 (${x}, ${y})，消耗 ${moveCost} 体力`, 'explore');
                }
                
                this.player.x = x;
                this.player.y = y;
                
                if (this.player.hpRegenPerTurn > 0) {
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.hpRegenPerTurn);
                }
                
                this.player.stamina = Math.min(this.player.maxStamina, this.player.stamina + this.player.staminaRegen);
                
                this.handleCellContent(cell);
                this.renderAll();
            }
            
            handleCellContent(cell) {
                if (!cell.contentType || cell.contentType === 'empty') {
                    if (Math.random() < 0.3) {
                        const smallGold = 1 + Math.floor(Math.random() * 5);
                        this.player.gold += smallGold;
                        this.addLog(`在杂草中发现了 ${smallGold} 金币！`, 'loot');
                    }
                    return;
                }
                
                switch (cell.contentType) {
                    case 'monster':
                        this.startBattle(cell);
                        break;
                    case 'temple':
                        this.enterTemple(cell);
                        break;
                    case 'chest':
                        this.openChest(cell);
                        break;
                    case 'supply':
                        this.useSupply(cell);
                        break;
                }
            }
            
            startBattle(cell) {
                const monster = cell.content;
                this.currentBattle = {
                    monster: { ...monster },
                    cell: cell,
                    turn: 0,
                    log: []
                };
                this.gameState = 'battle';
                this.renderBattle();
                this.addLog(`遭遇了 ${monster.icon} ${monster.name}！`, 'battle');
            }
            
            renderBattle() {
                const battle = this.currentBattle;
                if (!battle) return;
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                const playerHpPercent = (this.player.hp / this.player.maxHp) * 100;
                const monsterHpPercent = (battle.monster.hp / battle.monster.maxHp) * 100;
                
                content.innerHTML = `
                    <div class="battle-screen">
                        <div class="modal-title">⚔️ 战斗</div>
                        <div class="battle-combatants">
                            <div class="combatant">
                                <div class="combatant-icon">🧙</div>
                                <div class="combatant-name">你</div>
                                <div class="health-bar-container">
                                    <div class="health-bar" style="width: ${playerHpPercent}%"></div>
                                </div>
                                <div class="health-text">${this.player.hp}/${this.player.maxHp}</div>
                                <div style="font-size: 11px; color: #999; margin-top: 5px;">
                                    攻击: ${this.player.attack} | 防御: ${this.player.defense}
                                </div>
                            </div>
                            <div style="font-size: 36px; align-self: center;">⚔️</div>
                            <div class="combatant">
                                <div class="combatant-icon">${battle.monster.icon}</div>
                                <div class="combatant-name">${battle.monster.name}</div>
                                <div class="health-bar-container">
                                    <div class="health-bar" style="width: ${monsterHpPercent}%"></div>
                                </div>
                                <div class="health-text">${battle.monster.hp}/${battle.monster.maxHp}</div>
                                <div style="font-size: 11px; color: #999; margin-top: 5px;">
                                    攻击: ${battle.monster.attack} | 防御: ${battle.monster.defense}
                                </div>
                            </div>
                        </div>
                        <div class="battle-log" id="battle-log">
                            ${battle.log.length === 0 ? '<span style="color: #666;">战斗开始！</span>' : 
                              battle.log.map(l => `<div>${l}</div>`).join('')}
                        </div>
                        <div class="modal-buttons">
                            <button class="btn btn-primary" onclick="game.battleAttack()">攻击</button>
                            <button class="btn btn-secondary" onclick="game.battleDefend()">防御</button>
                            <button class="btn btn-danger" onclick="game.battleFlee()">逃跑</button>
                        </div>
                    </div>
                `;
                
                modal.classList.add('active');
            }
            
            battleAttack() {
                const battle = this.currentBattle;
                if (!battle) return;
                
                battle.turn++;
                
                let playerDamage = Math.max(1, this.player.attack - battle.monster.defense);
                const isCrit = Math.random() < this.player.critChance;
                
                if (isCrit) {
                    playerDamage = Math.floor(playerDamage * this.player.critDamage);
                }
                
                playerDamage = Math.floor(playerDamage * this.player.damageMultiplier);
                battle.monster.hp -= playerDamage;
                
                let playerMsg = `你造成了 ${playerDamage} 点伤害`;
                if (isCrit) playerMsg += ' (暴击！)';
                battle.log.push(playerMsg);
                
                if (battle.monster.hp <= 0) {
                    this.battleVictory();
                    return;
                }
                
                const monsterDamage = Math.max(1, battle.monster.attack - this.player.defense);
                this.player.hp -= monsterDamage;
                battle.log.push(`${battle.monster.name} 对你造成了 ${monsterDamage} 点伤害`);
                
                if (this.player.hp <= 0) {
                    this.battleDefeat();
                    return;
                }
                
                this.renderBattle();
            }
            
            battleDefend() {
                const battle = this.currentBattle;
                if (!battle) return;
                
                battle.turn++;
                
                const reducedDefense = this.player.defense * 2;
                const monsterDamage = Math.max(1, battle.monster.attack - reducedDefense);
                this.player.hp -= monsterDamage;
                battle.log.push(`你采取防御姿态，${battle.monster.name} 只造成了 ${monsterDamage} 点伤害`);
                
                this.player.hp = Math.min(this.player.maxHp, this.player.hp + Math.floor(this.player.defense * 0.5));
                
                if (this.player.hp <= 0) {
                    this.battleDefeat();
                    return;
                }
                
                this.renderBattle();
            }
            
            battleFlee() {
                const battle = this.currentBattle;
                if (!battle) return;
                
                const fleeChance = 0.4 + (this.player.moveSpeed * 0.1);
                
                if (Math.random() < fleeChance) {
                    battle.log.push('你成功逃跑了！');
                    this.addLog('成功逃离战斗', 'battle');
                    this.gameState = 'playing';
                    this.currentBattle = null;
                    document.getElementById('modal-overlay').classList.remove('active');
                    this.renderAll();
                } else {
                    battle.turn++;
                    battle.log.push('逃跑失败！');
                    const monsterDamage = Math.max(1, battle.monster.attack - this.player.defense);
                    this.player.hp -= monsterDamage;
                    battle.log.push(`${battle.monster.name} 趁机攻击，造成了 ${monsterDamage} 点伤害`);
                    
                    if (this.player.hp <= 0) {
                        this.battleDefeat();
                        return;
                    }
                    
                    this.renderBattle();
                }
            }
            
            battleVictory() {
                const battle = this.currentBattle;
                const monster = battle.monster;
                const reward = monster.reward;
                
                this.player.gold += reward.gold;
                this.player.incense += reward.incense;
                
                this.addLog(`击败了 ${monster.icon} ${monster.name}！获得 ${reward.gold} 金币和 ${reward.incense} 香火`, 'battle');
                
                battle.cell.contentType = 'empty';
                battle.cell.content = null;
                
                this.gameState = 'playing';
                this.currentBattle = null;
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="modal-title">🎉 战斗胜利！</div>
                    <div class="modal-content" style="text-align: center;">
                        <p>你击败了 ${monster.icon} ${monster.name}！</p>
                        <p style="margin-top: 15px;">
                            <span style="color: #feca57;">💰 ${reward.gold} 金币</span>
                            <span style="margin-left: 20px; color: #feca57;">🕯️ ${reward.incense} 香火</span>
                        </p>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn btn-primary" onclick="document.getElementById('modal-overlay').classList.remove('active');">继续探索</button>
                    </div>
                `;
                
                modal.classList.add('active');
                this.renderAll();
            }
            
            battleDefeat() {
                this.gameState = 'defeat';
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="modal-title">💀 你倒下了...</div>
                    <div class="modal-content" style="text-align: center;">
                        <p>在第 ${this.currentFloor} 层倒下了</p>
                        <p style="margin-top: 10px; color: #999;">
                            收集金币: ${this.player.gold}<br>
                            收集香火: ${this.player.incense}<br>
                            供奉神明: ${this.player.unlockedGods.length}/${DATA.gods.length}
                        </p>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn btn-primary" onclick="game.restart()">重新开始</button>
                    </div>
                `;
                
                modal.classList.add('active');
            }
            
            enterTemple(cell) {
                const god = cell.content;
                this.gameState = 'temple';
                this.currentTemple = { god, cell };
                this.renderTemple();
                this.addLog(`发现了供奉 ${god.icon} ${god.name} 的神庙`, 'temple');
            }
            
            renderTemple() {
                const temple = this.currentTemple;
                if (!temple) return;
                
                const god = temple.god;
                const isOffering = this.player.incense >= god.offeringCost;
                const isAlreadyOffered = this.unlockedGods.has(god.id);
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="temple-screen">
                        <div class="modal-title">🛕 ${god.name} 的神庙</div>
                        <div class="god-card ${isAlreadyOffered ? '' : 'offering'}">
                            <div class="god-icon">${god.icon}</div>
                            <div class="god-info">
                                <div class="god-name">${god.name}</div>
                                <div class="god-title">${god.title}</div>
                                <div class="god-blessing">✨ ${god.blessing}</div>
                                ${isAlreadyOffered ? 
                                    '<div class="god-faith" style="color: #1dd1a1;">✓ 已获得祝福</div>' : 
                                    `<div class="god-faith">🕯️ 供奉需要: ${god.offeringCost} 香火</div>`
                                }
                            </div>
                        </div>
                        <div class="temple-buttons">
                            ${isAlreadyOffered ? `
                                <button class="btn btn-secondary" onclick="game.closeModal()">离开</button>
                            ` : `
                                <button class="btn ${isOffering ? 'btn-primary' : 'btn btn-disabled'}" 
                                        ${isOffering ? `onclick="game.offerToGod()"` : 'disabled'}>
                                    供奉神明
                                </button>
                                <button class="btn btn-secondary" onclick="game.closeModal()">离开</button>
                            `}
                        </div>
                        ${!isAlreadyOffered ? `<div class="offering-cost">你当前有 ${this.player.incense} 香火</div>` : ''}
                    </div>
                `;
                
                modal.classList.add('active');
            }
            
            offerToGod() {
                const temple = this.currentTemple;
                if (!temple) return;
                
                const god = temple.god;
                if (this.player.incense < god.offeringCost) return;
                
                this.player.incense -= god.offeringCost;
                this.unlockedGods.add(god.id);
                
                if (!this.player.unlockedGods.includes(god.id)) {
                    this.player.unlockedGods.push(god.id);
                }
                
                this.applyGodBlessing(god);
                
                temple.cell.contentType = 'empty';
                temple.cell.content = null;
                
                this.addLog(`向 ${god.icon} ${god.name} 供奉香火，获得祝福: ${god.blessing}`, 'temple');
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="modal-title">✨ 获得祝福！</div>
                    <div class="modal-content" style="text-align: center;">
                        <p>${god.icon} ${god.name} 接受了你的供奉！</p>
                        <p style="margin-top: 15px; color: #48dbfb; font-weight: bold;">
                            ${god.blessing}
                        </p>
                        <p style="margin-top: 10px; color: #999; font-size: 12px;">
                            此效果将持续整个游戏
                        </p>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn btn-primary" onclick="game.closeModal()">继续探索</button>
                    </div>
                `;
                
                this.gameState = 'playing';
                this.currentTemple = null;
                this.renderAll();
            }
            
            applyGodBlessing(god) {
                const effect = god.effect;
                
                if (effect.maxStamina) {
                    this.player.maxStamina += effect.maxStamina;
                    this.player.stamina = this.player.maxStamina;
                }
                if (effect.baseAttack) {
                    this.player.baseAttack += effect.baseAttack;
                }
                if (effect.staminaRegen) {
                    this.player.staminaRegen *= (1 + effect.staminaRegen);
                }
                if (effect.baseDefense) {
                    this.player.baseDefense += effect.baseDefense;
                }
                if (effect.maxHp) {
                    this.player.maxHp += effect.maxHp;
                    this.player.hp = this.player.maxHp;
                }
                if (effect.damageMultiplier) {
                    this.player.damageMultiplier += effect.damageMultiplier;
                }
                if (effect.critChance) {
                    this.player.critChance += effect.critChance;
                }
                if (effect.hpRegenPerTurn) {
                    this.player.hpRegenPerTurn += effect.hpRegenPerTurn;
                }
                if (effect.critDamage) {
                    this.player.critDamage += effect.critDamage;
                }
                if (effect.moveCostReduction) {
                    this.player.moveCostReduction += effect.moveCostReduction;
                }
                
                this.updatePlayerStats();
            }
            
            updatePlayerStats() {
                this.player.attack = this.player.baseAttack;
                this.player.defense = this.player.baseDefense;
                this.player.moveSpeed = 1;
                
                Object.values(this.player.equipment).forEach(eq => {
                    if (eq) {
                        if (eq.attack) this.player.attack += eq.attack;
                        if (eq.defense) this.player.defense += eq.defense;
                        if (eq.moveSpeed) this.player.moveSpeed += eq.moveSpeed;
                    }
                });
            }
            
            openChest(cell) {
                const chest = cell.content;
                this.gameState = 'chest';
                
                let lootMessage = '';
                
                switch (chest.type) {
                    case 'equipment':
                        this.player.inventory.push({ ...chest.item, quantity: 1 });
                        lootMessage = `获得装备: ${chest.item.icon} ${chest.item.name}`;
                        break;
                    case 'incense':
                        this.player.incense += chest.amount;
                        lootMessage = `获得 🕯️ ${chest.amount} 香火`;
                        break;
                    case 'gold':
                        this.player.gold += chest.amount;
                        lootMessage = `获得 💰 ${chest.amount} 金币`;
                        break;
                    case 'potion':
                        const existingItem = this.player.inventory.find(i => i.id === chest.item.id);
                        if (existingItem) {
                            existingItem.quantity += chest.quantity;
                        } else {
                            this.player.inventory.push({ ...chest.item, quantity: chest.quantity });
                        }
                        lootMessage = `获得 ${chest.item.icon} ${chest.quantity}x ${chest.item.name}`;
                        break;
                }
                
                this.addLog(`打开宝箱：${lootMessage}`, 'loot');
                
                cell.contentType = 'empty';
                cell.content = null;
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="modal-title">📦 打开宝箱</div>
                    <div class="modal-content" style="text-align: center; font-size: 18px;">
                        ${lootMessage}
                    </div>
                    <div class="modal-buttons">
                        <button class="btn btn-primary" onclick="game.closeModal()">继续探索</button>
                    </div>
                `;
                
                modal.classList.add('active');
                this.gameState = 'playing';
                this.renderAll();
            }
            
            useSupply(cell) {
                const supply = cell.content;
                let message = '';
                
                if (supply.type === 'full_restore') {
                    this.player.hp = this.player.maxHp;
                    this.player.stamina = this.player.maxStamina;
                    message = '完全恢复了生命和体力！';
                } else if (supply.type === 'health') {
                    const healAmount = 30;
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + healAmount);
                    message = `恢复了 ${healAmount} 点生命`;
                } else if (supply.type === 'stamina') {
                    const staminaAmount = 30;
                    this.player.stamina = Math.min(this.player.maxStamina, this.player.stamina + staminaAmount);
                    message = `恢复了 ${staminaAmount} 点体力`;
                }
                
                this.addLog(`发现补给：${message}`, 'loot');
                
                cell.contentType = 'empty';
                cell.content = null;
                
                const modal = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                    <div class="modal-title">🏕️ 发现补给</div>
                    <div class="modal-content" style="text-align: center; font-size: 18px; color: #1dd1a1;">
                        ${message}
                    </div>
                    <div class="modal-buttons">
                        <button class="btn btn-primary" onclick="game.closeModal()">继续探索</button>
                    </div>
                `;
                
                modal.classList.add('active');
                this.renderAll();
            }
            
            closeModal() {
                document.getElementById('modal-overlay').classList.remove('active');
                this.gameState = 'playing';
            }
            
            useItem(itemIndex) {
                const item = this.player.inventory[itemIndex];
                if (!item || item.type !== 'consumable') return;
                
                if (item.effect.hp) {
                    const oldHp = this.player.hp;
                    this.player.hp = Math.min(this.player.maxHp, this.player.hp + item.effect.hp);
                    this.addLog(`使用 ${item.icon} ${item.name}，恢复 ${this.player.hp - oldHp} 点生命`, 'loot');
                }
                if (item.effect.stamina) {
                    const oldStamina = this.player.stamina;
                    this.player.stamina = Math.min(this.player.maxStamina, this.player.stamina + item.effect.stamina);
                    this.addLog(`使用 ${item.icon} ${item.name}，恢复 ${this.player.stamina - oldStamina} 点体力`, 'loot');
                }
                
                item.quantity--;
                if (item.quantity <= 0) {
                    this.player.inventory.splice(itemIndex, 1);
                }
                
                this.renderAll();
            }
            
            equipItem(itemIndex) {
                const item = this.player.inventory[itemIndex];
                if (!item || !item.slot) return;
                
                const oldEquip = this.player.equipment[item.slot];
                
                this.player.equipment[item.slot] = { ...item };
                
                this.player.inventory.splice(itemIndex, 1);
                
                if (oldEquip) {
                    this.player.inventory.push({ ...oldEquip, quantity: 1 });
                }
                
                this.updatePlayerStats();
                this.addLog(`装备了 ${item.icon} ${item.name}`, 'loot');
                this.renderAll();
            }
            
            unequipItem(slot) {
                const item = this.player.equipment[slot];
                if (!item) return;
                
                this.player.inventory.push({ ...item, quantity: 1 });
                this.player.equipment[slot] = null;
                
                this.updatePlayerStats();
                this.addLog(`卸下了 ${item.icon} ${item.name}`, 'loot');
                this.renderAll();
            }
            
            checkFloorComplete() {
                const unexplored = this.map.flat().filter(c => !c.explored && c.type === 'locked');
                return unexplored.length === 0;
            }
            
            nextFloor() {
                this.currentFloor++;
                this.initMap();
                this.addLog(`进入第 ${this.currentFloor} 层...`, 'explore');
                this.renderAll();
            }
            
            addLog(message, type = 'explore') {
                this.logs.unshift({ message, type, time: Date.now() });
                if (this.logs.length > 50) {
                    this.logs.pop();
                }
            }
            
            switchTab(tabName) {
                const tabs = ['inventory', 'equipment', 'gods', 'stats'];
                const tabBtns = document.querySelectorAll('.tab-btn');
                const tabContents = document.querySelectorAll('.tab-content');
                
                tabs.forEach((tab, index) => {
                    if (tab === tabName) {
                        tabBtns[index].classList.add('active');
                        tabContents[index].classList.add('active');
                    } else {
                        tabBtns[index].classList.remove('active');
                        tabContents[index].classList.remove('active');
                    }
                });
            }
            
            renderAll() {
                this.renderStats();
                this.renderMap();
                this.renderLogs();
                this.renderInventory();
                this.renderEquipment();
                this.renderGods();
                this.renderPlayerStats();
            }
            
            renderStats() {
                document.getElementById('floor-num').textContent = this.currentFloor;
                document.getElementById('stamina-value').textContent = `${Math.floor(this.player.stamina)}/${this.player.maxStamina}`;
                document.getElementById('stamina-bar').style.width = `${(this.player.stamina / this.player.maxStamina) * 100}%`;
                document.getElementById('incense-value').textContent = this.player.incense;
                document.getElementById('gold-value').textContent = this.player.gold;
            }
            
            renderMap() {
                const grid = document.getElementById('map-grid');
                const mapSize = this.map.length;
                
                grid.style.gridTemplateColumns = `repeat(${mapSize}, 40px)`;
                grid.innerHTML = '';
                
                for (let y = 0; y < mapSize; y++) {
                    for (let x = 0; x < mapSize; x++) {
                        const cell = this.map[y][x];
                        const div = document.createElement('div');
                        div.className = 'map-cell';
                        
                        let icon = '';
                        let cellClass = '';
                        let tooltip = '';
                        
                        if (x === this.player.x && y === this.player.y) {
                            icon = '🧙';
                            cellClass = 'player';
                            tooltip = '你';
                        } else if (!cell.explored) {
                            if (cell.type === 'locked') {
                                icon = '❓';
                                cellClass = 'locked can-move';
                                tooltip = '未探索 (消耗10体力)';
                            } else {
                                icon = '🌑';
                                cellClass = 'chaos';
                                tooltip = '混沌';
                            }
                        } else {
                            cellClass = 'explored';
                            switch (cell.contentType) {
                                case 'monster':
                                    icon = cell.content ? cell.content.icon : '👹';
                                    tooltip = cell.content ? `${cell.content.name} (战斗)` : '空';
                                    break;
                                case 'temple':
                                    icon = '🛕';
                                    tooltip = cell.content ? `${cell.content.name} 的神庙` : '空神庙';
                                    break;
                                case 'chest':
                                    icon = '📦';
                                    tooltip = '宝箱';
                                    break;
                                case 'supply':
                                    icon = '🏕️';
                                    tooltip = '补给点';
                                    break;
                                default:
                                    icon = '🌿';
                                    tooltip = '已探索';
                            }
                        }
                        
                        div.classList.add(cellClass);
                        div.innerHTML = `${icon}<div class="cell-tooltip">${tooltip}</div>`;
                        
                        if (this.canMoveTo(x, y) && this.gameState === 'playing') {
                            div.onclick = () => this.moveTo(x, y);
                        }
                        
                        grid.appendChild(div);
                    }
                }
            }
            
            renderLogs() {
                const content = document.getElementById('log-content');
                content.innerHTML = this.logs.slice(0, 10).map(log => 
                    `<div class="log-entry ${log.type}">${log.message}</div>`
                ).join('');
            }
            
            renderInventory() {
                const content = document.getElementById('inventory-content');
                const consumables = this.player.inventory.filter(i => i.type === 'consumable');
                const equipment = this.player.inventory.filter(i => i.slot);
                
                let html = '';
                
                if (consumables.length > 0) {
                    html += '<div style="margin-bottom: 10px;"><strong style="color: #feca57;">消耗品</strong></div>';
                    consumables.forEach((item, idx) => {
                        const actualIdx = this.player.inventory.indexOf(item);
                        html += `
                            <div class="item-slot" onclick="game.useItem(${actualIdx})">
                                <div class="item-icon">${item.icon}</div>
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-desc">${item.desc}</div>
                                </div>
                                <div class="item-quantity">x${item.quantity}</div>
                            </div>
                        `;
                    });
                }
                
                if (equipment.length > 0) {
                    html += '<div style="margin-bottom: 10px; margin-top: 15px;"><strong style="color: #feca57;">装备</strong></div>';
                    equipment.forEach((item, idx) => {
                        const actualIdx = this.player.inventory.indexOf(item);
                        let stats = [];
                        if (item.attack) stats.push(`攻击+${item.attack}`);
                        if (item.defense) stats.push(`防御+${item.defense}`);
                        if (item.moveSpeed) stats.push(`移速+${item.moveSpeed}`);
                        
                        html += `
                            <div class="item-slot" onclick="game.equipItem(${actualIdx})">
                                <div class="item-icon">${item.icon}</div>
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-desc">${stats.join(', ') || item.desc}</div>
                                </div>
                            </div>
                        `;
                    });
                }
                
                if (html === '') {
                    html = '<div style="color: #666; text-align: center; padding: 20px;">背包为空</div>';
                }
                
                content.innerHTML = html;
            }
            
            renderEquipment() {
                const content = document.getElementById('equipment-content');
                const slots = [
                    { key: 'weapon', name: '武器' },
                    { key: 'armor', name: '护甲' },
                    { key: 'boots', name: '鞋子' },
                    { key: 'accessory', name: '饰品' }
                ];
                
                let html = '';
                
                slots.forEach(slot => {
                    const item = this.player.equipment[slot.key];
                    if (item) {
                        let stats = [];
                        if (item.attack) stats.push(`攻击+${item.attack}`);
                        if (item.defense) stats.push(`防御+${item.defense}`);
                        if (item.moveSpeed) stats.push(`移速+${item.moveSpeed}`);
                        
                        html += `
                            <div class="item-slot" onclick="game.unequipItem('${slot.key}')">
                                <div class="item-icon">${item.icon}</div>
                                <div class="item-info">
                                    <div class="item-name">${item.name} (${slot.name})</div>
                                    <div class="item-desc">${stats.join(', ') || item.desc}</div>
                                </div>
                                <div style="color: #999; font-size: 11px;">点击卸下</div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="item-slot" style="opacity: 0.5;">
                                <div class="item-icon">➖</div>
                                <div class="item-info">
                                    <div class="item-name">${slot.name}</div>
                                    <div class="item-desc">空</div>
                                </div>
                            </div>
                        `;
                    }
                });
                
                content.innerHTML = html;
            }
            
            renderGods() {
                const content = document.getElementById('gods-content');
                let html = '';
                
                DATA.gods.forEach(god => {
                    const isUnlocked = this.unlockedGods.has(god.id);
                    html += `
                        <div class="god-card ${isUnlocked ? 'offering' : ''}">
                            <div class="god-icon">${god.icon}</div>
                            <div class="god-info">
                                <div class="god-name">${god.name}</div>
                                <div class="god-title">${god.title}</div>
                                <div class="god-blessing">✨ ${god.blessing}</div>
                                ${isUnlocked ? 
                                    '<div class="god-faith" style="color: #1dd1a1;">✓ 已获得祝福</div>' : 
                                    `<div class="god-faith">🕯️ 供奉需要: ${god.offeringCost} 香火</div>`
                                }
                            </div>
                        </div>
                    `;
                });
                
                content.innerHTML = html;
            }
            
            renderPlayerStats() {
                const content = document.getElementById('stats-content');
                const stats = [
                    { label: '生命值', value: `${this.player.hp}/${this.player.maxHp}` },
                    { label: '体力值', value: `${Math.floor(this.player.stamina)}/${this.player.maxStamina}` },
                    { label: '攻击力', value: this.player.attack },
                    { label: '防御力', value: this.player.defense },
                    { label: '移动速度', value: this.player.moveSpeed },
                    { label: '暴击率', value: `${(this.player.critChance * 100).toFixed(0)}%` },
                    { label: '暴击伤害', value: `${((this.player.critDamage - 1) * 100).toFixed(0)}%` },
                    { label: '伤害加成', value: `${((this.player.damageMultiplier - 1) * 100).toFixed(0)}%` },
                    { label: '体力恢复', value: `${this.player.staminaRegen.toFixed(1)}/回合` },
                    { label: '生命恢复', value: `${this.player.hpRegenPerTurn}/回合` },
                    { label: '移动消耗', value: `${Math.floor(10 * (1 - this.player.moveCostReduction))} 体力` },
                    { label: '当前层数', value: this.currentFloor }
                ];
                
                let html = '';
                stats.forEach(stat => {
                    html += `
                        <div class="stat-detail-item">
                            <div class="stat-detail-label">${stat.label}</div>
                            <div class="stat-detail-value">${stat.value}</div>
                        </div>
                    `;
                });
                
                content.innerHTML = html;
            }
            
            restart() {
                document.getElementById('modal-overlay').classList.remove('active');
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
                
                this.player = null;
                this.map = null;
                this.currentFloor = 1;
                this.gameState = 'start';
                this.currentBattle = null;
                this.unlockedGods = new Set();
                this.blessings = {};
                this.logs = [];
            }
        }
        
        const game = new Game();
    </script>
</body>
</html>
